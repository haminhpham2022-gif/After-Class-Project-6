<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
</head>
<body>
    <div>
        <form>
            <center><h2>Employment Application</h2></center>
            <fieldset>
                <legend>Personal Information</legend>
                <label>Name:</label><br>
                <input type="text" placeholder="Enter Name"><br>
                <label>Date of Birth:</label><br>
                <input type="date" placeholder="Enter Name"><br>
                <label>Residence:</label><br>
                <textarea></textarea><br>
                <label>Phone Number:</label><br>
                <input type="password" placeholder="Enter number"><br>
                <label>Email:</label><br>
                <input type="email" placeholder="Enter email"><br>
                <label>Gender:</label><br>
                <input type="radio">Male<br>
                <input type="radio">Female<br>
                <input type="radio">Other<br>
                <br>
                <input type="submit">
            </fieldset>
        </form>
    </div>
        <div>
        <form>
            <fieldset>
                <legend>Qualifications</legend>
                <label>Desired Position:</label><br>
                <input type="text"><br>
                <label>Previous Experiences:</label><br>
                <textarea></textarea><br>
                <label>Education:</label><br>
                <textarea></textarea><br>
                <label>Starting Date:</label><br>
                <input type="date"><br>
                <label>Looking to work:</label><br>
                <input type="radio">Full Time<br>
                <input type="radio">Half Time<br>
                <input type="radio">Temporary<br>
                <br>
                <input type="submit">
            </fieldset>
        </form>
    </div>
</body>
</html>
